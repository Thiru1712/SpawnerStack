name: Unzip SpawnerStack
on: workflow_dispatch

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip archive
        run: |
          unzip -o SpawnerStack.zip
          rm SpawnerStack.zip
          # Remove build.yml from the commit to prevent GitHub's permission block
          rm -rf .github/workflows/build.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Unpack SpawnerStack.zip"
          git push

